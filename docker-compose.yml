services:
    conduit:
        image: ghcr.io/psiphon-inc/conduit/cli:latest
        container_name: conduit
        user: "0:0"
        command:
            [
                "start",
                "--max-clients",
                "50",
                "--bandwidth",
                "100",
                "--data-dir",
                "/home/conduit/data",
                "--metrics-addr",
                "0.0.0.0:9090",
            ]
        # Metrics are exposed inside the container on :9090.
        # To scrape from the host, publish the port (e.g., "9090:9090").
        volumes:
            - ./conduit-data:/home/conduit/data

    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        user: "0:0"
        command:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml
            - ./prometheus-data:/prometheus
        depends_on:
            - conduit

    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        user: "0:0"
        environment:
            - GF_SECURITY_ADMIN_USER__FILE=/run/secrets/admin_user
            - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/admin_password
            - GF_USERS_ALLOW_SIGN_UP=false
        volumes:
            - ./grafana-data:/var/lib/grafana
            - ./grafana-provisioning:/etc/grafana/provisioning
            - ./secrets/admin_user:/run/secrets/admin_user:ro
            - ./secrets/admin_password:/run/secrets/admin_password:ro
        ports:
            - "3000:3000"
        depends_on:
            - prometheus